name: Central de Radares

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: central-radares
  cancel-in-progress: false

jobs:
  pesquisa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes (se falharem, nada é publicado)
        run: python -m unittest discover -s tests -t .

      - name: Pesquisar, validar e gerar os CSVs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python -m central.run

      - name: Publicar dados atualizados
        run: |
          git config user.name "central-radares[bot]"
          git config user.email "central-radares@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualização automática da Central de Radares"
            git push
          fi
          
